<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title description">
  <title id="title">Rohan — black and gold architectural R</title>
  <desc id="description">An angular, sculpted R with polished gold faces, fine beveled edges and dark gold depth on a black background. No additional text or circular frame.</desc>
  <defs>
    <radialGradient id="background" cx=".52" cy=".4" r=".7">
      <stop stop-color="#20201d"/>
