      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="319" y1="219" x2="619" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b5842e"/>
      <stop offset=".24" stop-color="#f2d47d"/>
      <stop offset=".43" stop-color="#fff2b6"/>
      <stop offset=".64" stop-color="#d5aa4b"/>
      <stop offset="1" stop-color="#8e611c"/>
    </linearGradient>
    <linearGradient id="stem" x1="321" y1="242" x2="401" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a97726"/>
      <stop offset=".26" stop-color="#ffe8a0"/>
      <stop offset=".55" stop-color="#d1a347"/>
