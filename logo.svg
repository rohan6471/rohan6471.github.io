      <stop offset="1" stop-color="#e9c775"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="10" dy="20" stdDeviation="13" flood-color="#000000" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1000" height="800" fill="url(#background)"/>
